<div class="mx-auto mt-12 w-full max-w-sm">
  <h2 class="mb-6 text-center text-2xl text-teal">Nové heslo</h2>

  @if (!token) {
    <div class="card flex flex-col gap-3">
      <p>Odkaz není úplný. Požádej prosím o nový.</p>
      <a routerLink="/forgot-password">Zapomenuté heslo</a>
    </div>
  } @else {
    <div class="card flex flex-col gap-4">
      <label class="field-label">
        Nové heslo
        <input class="input" type="password" [value]="password()"
               (input)="password.set($any($event.target).value)" />
      </label>
      <label class="field-label">
        Nové heslo znovu
        <input class="input" type="password" [value]="confirm()"
               (input)="confirm.set($any($event.target).value)" />
      </label>
      <button class="btn" (click)="submit()" [disabled]="loading()">Nastavit heslo</button>
      @if (error()) {
        <p class="error-text">{{ error() }}</p>
        @if (error().startsWith('Odkaz')) {
          <a routerLink="/forgot-password">Poslat nový odkaz</a>
        }
      }
    </div>
  }
</div>
