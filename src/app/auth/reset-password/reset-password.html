<h2>Nové heslo</h2>

@if (!token) {
  <p>Odkaz není úplný. Požádej prosím o nový.</p>
  <a routerLink="/forgot-password">Zapomenuté heslo</a>
} @else {
  <input type="password" placeholder="Nové heslo" [value]="password()" (input)="password.set($any($event.target).value)" />
  <input type="password" placeholder="Nové heslo znovu" [value]="confirm()" (input)="confirm.set($any($event.target).value)" />
  <button (click)="submit()" [disabled]="loading()">Nastavit heslo</button>
  @if (error()) {
    <p>{{ error() }}</p>
    @if (error().startsWith('Odkaz')) {
      <a routerLink="/forgot-password">Poslat nový odkaz</a>
    }
  }
}
