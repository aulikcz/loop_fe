<div class="mx-auto mt-12 w-full max-w-sm">
  <h2 class="mb-6 text-center text-2xl text-teal">Zapomenuté heslo</h2>

  <div class="card flex flex-col gap-4">
    @if (sent()) {
      <p>Pokud účet s tímto e-mailem existuje, poslali jsme na něj odkaz pro nastavení nového hesla.</p>
      <a routerLink="/login">Zpět na přihlášení</a>
    } @else {
      <label class="field-label">
        E-mail
        <input class="input" type="email" [value]="email()"
               (input)="email.set($any($event.target).value)" />
      </label>
      <button class="btn" (click)="submit()" [disabled]="loading() || !email()">Poslat odkaz</button>
      @if (error()) {
        <p class="error-text">{{ error() }}</p>
      }
      <a routerLink="/login">Zpět na přihlášení</a>
    }
  </div>
</div>
