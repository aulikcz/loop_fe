<h2>Zapomenuté heslo</h2>

@if (sent()) {
  <p>Pokud účet s tímto e-mailem existuje, poslali jsme na něj odkaz pro nastavení nového hesla.</p>
  <a routerLink="/login">Zpět na přihlášení</a>
} @else {
  <input type="email" placeholder="E-mail" [value]="email()" (input)="email.set($any($event.target).value)" />
  <button (click)="submit()" [disabled]="loading() || !email()">Poslat odkaz</button>
  @if (error()) {
    <p>{{ error() }}</p>
  }
  <a routerLink="/login">Zpět na přihlášení</a>
}
