<div class="mb-6 flex items-center justify-between">
  <h2 class="text-2xl font-semibold">Moje postavy</h2>
  <a routerLink="/characters/new" class="btn">+ Nová postava</a>
</div>

@if (loading()) {
  <p class="text-dim">Načítám…</p>
} @else if (error()) {
  <p class="error-text">{{ error() }}</p>
} @else if (characters().length === 0) {
  <div class="card text-center text-dim">Zatím nemáš žádnou postavu.</div>
} @else {
  <ul class="grid gap-3 sm:grid-cols-2">
    @for (c of characters(); track c.id) {
      <li>
        <a [routerLink]="['/characters', c.id]" class="card card-link block hover:no-underline">
          <div class="font-display text-lg font-semibold text-ink">{{ c.name }}</div>
          <span class="badge mt-2 inline-block">{{ c.systemCode }}</span>
        </a>
      </li>
    }
  </ul>
}
