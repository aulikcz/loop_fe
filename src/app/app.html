<header class="topbar">
  <a routerLink="/games" class="brand">Loop</a>
  <nav><a routerLink="/games">Hry</a></nav>
</header>

<main>
  <details class="panel">
    <summary>Herní systémy</summary>
    <button (click)="load()">Načíst Game Systems</button>
    @for (gs of gameSystems(); track gs.id) {
      <p>{{ gs.name }} ({{ gs.code }})</p>
    }
  </details>

  <router-outlet />
</main>
