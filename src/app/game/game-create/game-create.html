<h2 class="mb-6 text-2xl">Nová hra</h2>

<div class="card flex max-w-lg flex-col gap-4">
  <label class="field-label">
    Název
    <input #nameInput class="input" (input)="name.set(nameInput.value)">
  </label>

  <label class="field-label">
    Systém
    <select #systemSelect class="input" (change)="gameSystemCode.set(systemSelect.value)">
      <option value="">-- vyber --</option>
      @for (gs of gameSystems(); track gs.id) {
        <option [value]="gs.code">{{ gs.name }}</option>
      }
    </select>
  </label>

  <div class="flex gap-2">
    <button class="btn" (click)="save()">Založit</button>
    <a routerLink="/games" class="btn btn-ghost">Zpět</a>
  </div>
</div>
